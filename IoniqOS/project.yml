name: MedicationLock
options:
  bundleIdPrefix: com.mattgottfried.medlock
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15.0"

settings:
  base:
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: "X796Z5UW4P"  # Fill in your Apple Developer Team ID
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: 1

schemes:
  MedicationLock:
    build:
      targets:
        MedicationLock: all
    run:
      config: Debug
    archive:
      config: Release

targets:
  MedicationLock:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - MedicationLock
    resources:
      - MedicationLock/Resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mattgottfried.medlock
        INFOPLIST_FILE: MedicationLock/Resources/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: MedicationLock/Resources/MedicationLock.entitlements
    dependencies:
      - target: MedicationLockMonitor
      - target: MedicationLockShield
    entitlements:
      path: MedicationLock/Resources/MedicationLock.entitlements

  MedicationLockMonitor:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - MedicationLockMonitor
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mattgottfried.medlock.monitor
        INFOPLIST_FILE: MedicationLockMonitor/Info.plist
        CODE_SIGN_ENTITLEMENTS: MedicationLockMonitor/MedicationLockMonitor.entitlements
    entitlements:
      path: MedicationLockMonitor/MedicationLockMonitor.entitlements

  MedicationLockShield:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - MedicationLockShield
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mattgottfried.medlock.shield
        INFOPLIST_FILE: MedicationLockShield/Info.plist
        CODE_SIGN_ENTITLEMENTS: MedicationLockShield/MedicationLockShield.entitlements
    entitlements:
      path: MedicationLockShield/MedicationLockShield.entitlements
